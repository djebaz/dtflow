<!-- @dsCard group="Typography" viewport="700x200" name="Type Scale" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 30px; background: var(--color-background); }
    .sample { margin-bottom: 24px; }
    .role { font-size: 9pt; color: var(--color-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .text-title { font-size: 17pt; font-weight: 650; color: var(--color-text); }
    .text-section { font-size: 11pt; font-weight: 600; color: var(--color-text); }
    .text-body { font-size: 10pt; font-weight: 400; color: var(--color-text); }
    .text-small { font-size: 9pt; font-weight: 400; color: var(--color-secondary); }
  </style>
</head>
<body>
  <div class="sample">
    <div class="role">Title</div>
    <div class="text-title">Workspace Title</div>
  </div>
  <div class="sample">
    <div class="role">Section Heading</div>
    <div class="text-section">Section Heading</div>
  </div>
  <div class="sample">
    <div class="role">Body</div>
    <div class="text-body">Regular body text at 10pt for form content and descriptions</div>
  </div>
  <div class="sample">
    <div class="role">Small / Caption</div>
    <div class="text-small">Metadata, labels, and supporting text in 9pt</div>
  </div>
</body>
</html>
