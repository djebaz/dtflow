<!-- @dsCard group="Typography" viewport="700x200" name="Font Weights" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 30px; background: var(--color-background); }
    .sample { margin-bottom: 20px; }
    .label { font-size: 9pt; color: var(--color-secondary); margin-bottom: 4px; }
    .weight { font-size: 14pt; color: var(--color-text); }
  </style>
</head>
<body>
  <div class="sample">
    <div class="label">Regular 400</div>
    <div class="weight" style="font-weight: 400;">Default body text and content</div>
  </div>
  <div class="sample">
    <div class="label">Medium 500</div>
    <div class="weight" style="font-weight: 500;">Field labels and captions</div>
  </div>
  <div class="sample">
    <div class="label">Emphasis 600</div>
    <div class="weight" style="font-weight: 600;">Active states, section headings, values</div>
  </div>
  <div class="sample">
    <div class="label">Title 650</div>
    <div class="weight" style="font-weight: 650;">Workspace titles and primary headings</div>
  </div>
  <div class="sample">
    <div class="label">Strong 700</div>
    <div class="weight" style="font-weight: 700;">Product mark, strong emphasis</div>
  </div>
</body>
</html>
