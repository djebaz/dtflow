<!-- @dsCard group="Colors" viewport="700x180" name="Section Card Surfaces" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 20px; display: flex; gap: 12px; }
    .item { flex: 1; }
    .swatch { height: 80px; border-radius: 6px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .label { font-size: 10pt; font-weight: 500; color: var(--color-text); }
    .hex { font-size: 9pt; color: var(--color-secondary); font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <div class="item"><div class="swatch" style="background:var(--color-section-header)"></div><div class="label">Section Header</div><div class="hex">#2b2b2b</div></div>
  <div class="item"><div class="swatch" style="background:var(--color-section-border)"></div><div class="label">Section Border</div><div class="hex">#343434</div></div>
  <div class="item"><div class="swatch" style="background:var(--color-item-surface)"></div><div class="label">Item Surface</div><div class="hex">#222222</div></div>
</body>
</html>
