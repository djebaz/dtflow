<!-- @dsCard group="Colors" viewport="700x180" name="Accent & Focus" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 20px; display: flex; gap: 12px; }
    .item { flex: 1; }
    .swatch { height: 80px; border-radius: 6px; margin-bottom: 8px; }
    .label { font-size: 10pt; font-weight: 500; color: var(--color-text); }
    .hex { font-size: 9pt; color: var(--color-secondary); font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <div class="item">
    <div class="swatch" style="background-color: var(--color-accent);"></div>
    <div class="label">Accent</div>
    <div class="hex">#0068b8</div>
  </div>
  <div class="item">
    <div class="swatch" style="background-color: var(--color-accent-hover);"></div>
    <div class="label">Accent Hover</div>
    <div class="hex">#0078d4</div>
  </div>
  <div class="item">
    <div class="swatch" style="background-color: var(--color-accent-pressed);"></div>
    <div class="label">Accent Press</div>
    <div class="hex">#005a9e</div>
  </div>
  <div class="item">
    <div class="swatch" style="background-color: var(--color-focus);"></div>
    <div class="label">Focus</div>
    <div class="hex">#60b6f6</div>
  </div>
</body>
</html>
