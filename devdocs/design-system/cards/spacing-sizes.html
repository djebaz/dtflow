<!-- @dsCard group="Spacing" viewport="700x300" name="Sizes & Radii" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 30px; background: var(--color-background); display: flex; gap: 40px; flex-wrap: wrap; }
    .group { }
    .item { margin-bottom: 16px; }
    .label { font-size: 9pt; color: var(--color-secondary); margin-bottom: 6px; }
    .visual { height: 40px; background: var(--color-surface); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; font-size: 12pt; color: var(--color-text); }
  </style>
</head>
<body>
  <div class="group">
    <h3 style="font-size: 11pt; font-weight: 600; color: var(--color-text); margin-bottom: 20px;">Radii</h3>
    <div class="item">
      <div class="label">Input: 5px</div>
      <div class="visual" style="border-radius: 5px;">Rx 5</div>
    </div>
    <div class="item">
      <div class="label">Button: 6px</div>
      <div class="visual" style="border-radius: 6px;">Rx 6</div>
    </div>
    <div class="item">
      <div class="label">Panel: 8px</div>
      <div class="visual" style="border-radius: 8px;">Rx 8</div>
    </div>
  </div>
  <div class="group">
    <h3 style="font-size: 11pt; font-weight: 600; color: var(--color-text); margin-bottom: 20px;">Spacing</h3>
    <div class="item">
      <div class="label">Workspace Gutter</div>
      <div style="font-size: 10pt; color: var(--color-text);">8px</div>
    </div>
    <div class="item">
      <div class="label">Panel Padding</div>
      <div style="font-size: 10pt; color: var(--color-text);">12px</div>
    </div>
    <div class="item">
      <div class="label">Canvas Overlay Inset</div>
      <div style="font-size: 10pt; color: var(--color-text);">10px</div>
    </div>
    <div class="item">
      <div class="label">Control Content Height</div>
      <div style="font-size: 10pt; color: var(--color-text);">22px min</div>
    </div>
  </div>
<div class="group"><h3 style="font-size: 11pt; font-weight: 600; color: var(--color-text); margin-bottom: 20px;">Gap scale</h3><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="width:60px;font-size:9pt;color:var(--color-secondary)">--space-3xs</span><span style="height:8px;width:var(--space-3xs);background:var(--color-accent);display:block"></span><span style="font-size:9pt">2px</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="width:60px;font-size:9pt;color:var(--color-secondary)">--space-2xs</span><span style="height:8px;width:var(--space-2xs);background:var(--color-accent);display:block"></span><span style="font-size:9pt">4px</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="width:60px;font-size:9pt;color:var(--color-secondary)">--space-xs</span><span style="height:8px;width:var(--space-xs);background:var(--color-accent);display:block"></span><span style="font-size:9pt">6px</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="width:60px;font-size:9pt;color:var(--color-secondary)">--space-sm</span><span style="height:8px;width:var(--space-sm);background:var(--color-accent);display:block"></span><span style="font-size:9pt">8px</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="width:60px;font-size:9pt;color:var(--color-secondary)">--space-md</span><span style="height:8px;width:var(--space-md);background:var(--color-accent);display:block"></span><span style="font-size:9pt">10px</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="width:60px;font-size:9pt;color:var(--color-secondary)">--space-lg</span><span style="height:8px;width:var(--space-lg);background:var(--color-accent);display:block"></span><span style="font-size:9pt">12px</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="width:60px;font-size:9pt;color:var(--color-secondary)">--space-xl</span><span style="height:8px;width:var(--space-xl);background:var(--color-accent);display:block"></span><span style="font-size:9pt">14px</span></div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="width:60px;font-size:9pt;color:var(--color-secondary)">--space-2xl</span><span style="height:8px;width:var(--space-2xl);background:var(--color-accent);display:block"></span><span style="font-size:9pt">18px</span></div></div></body>
</html>
