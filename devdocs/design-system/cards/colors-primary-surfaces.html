<!-- @dsCard group="Colors" viewport="700x180" name="Primary Surfaces" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 20px; display: flex; gap: 12px; }
    .swatch { flex: 1; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 140px; }
    .label { font-size: 11pt; font-weight: 600; color: white; }
    .hex { font-size: 9pt; color: rgba(255,255,255,0.7); margin-top: 8px; font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <div class="swatch" style="background-color: var(--color-background);">
    <div class="label">Background</div>
    <div class="hex">#1f1f1f</div>
  </div>
  <div class="swatch" style="background-color: var(--color-surface);">
    <div class="label">Surface</div>
    <div class="hex">#252525</div>
  </div>
  <div class="swatch" style="background-color: var(--color-input);">
    <div class="label">Input</div>
    <div class="hex">#1e1e1e</div>
  </div>
  <div class="swatch" style="background-color: var(--color-canvas);">
    <div class="label">Canvas</div>
    <div class="hex">#151515</div>
  </div>
</body>
</html>
