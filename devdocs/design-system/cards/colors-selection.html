<!-- @dsCard group="Colors" viewport="700x180" name="Selection & Navigation" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 20px; display: flex; gap: 12px; }
    .item { flex: 1; }
    .swatch { height: 80px; border-radius: 6px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .label { font-size: 10pt; font-weight: 500; color: var(--color-text); }
    .hex { font-size: 9pt; color: var(--color-secondary); font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <div class="item">
    <div class="swatch" style="background-color: var(--color-selection);"></div>
    <div class="label">Selection</div>
    <div class="hex">#173852</div>
  </div>
  <div class="item">
    <div class="swatch" style="background-color: var(--color-selection-hover);"></div>
    <div class="label">Selection Hover</div>
    <div class="hex">#204c6e</div>
  </div>
  <div class="item">
    <div class="swatch" style="background-color: var(--color-selection-pressed);"></div>
    <div class="label">Selection Press</div>
    <div class="hex">#122e44</div>
  </div>
  <div class="item">
    <div class="swatch" style="background-color: var(--color-selection-border);"></div>
    <div class="label">Selection Border</div>
    <div class="hex">#285d84</div>
  </div>
</body>
</html>
