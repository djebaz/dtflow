<!-- @dsCard group="Colors" viewport="700x300" name="Borders & Control States" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.swatch{height:56px;border-radius:6px;margin-bottom:6px;border:1px solid rgba(255,255,255,.1)}.label{font-size:9pt;font-weight:500}.hex{font-size:8pt;color:var(--color-secondary);font-family:Consolas,monospace}</style></head>
<body><div class="item"><div class="swatch" style="background:var(--color-border)"></div><div class="label">Border</div><div class="hex">#3a3a3a</div></div><div class="item"><div class="swatch" style="background:var(--color-border-strong)"></div><div class="label">Border Strong</div><div class="hex">#4a4a4a</div></div><div class="item"><div class="swatch" style="background:var(--color-disabled-border)"></div><div class="label">Disabled Border</div><div class="hex">#303030</div></div><div class="item"><div class="swatch" style="background:var(--color-input-border-hover)"></div><div class="label">Input Hover</div><div class="hex">#606060</div></div><div class="item"><div class="swatch" style="background:var(--color-button-border)"></div><div class="label">Button Border</div><div class="hex">#424242</div></div><div class="item"><div class="swatch" style="background:var(--color-button-border-hover)"></div><div class="label">Button Border Hover</div><div class="hex">#5a5a5a</div></div><div class="item"><div class="swatch" style="background:var(--color-button-pressed)"></div><div class="label">Button Pressed</div><div class="hex">#292929</div></div><div class="item"><div class="swatch" style="background:var(--color-selection-text)"></div><div class="label">Selection Text</div><div class="hex">#d5ecff</div></div><div class="item"><div class="swatch" style="background:var(--color-connection-glyph)"></div><div class="label">Connection Glyph</div><div class="hex">#d9f7ef</div></div></body></html>
