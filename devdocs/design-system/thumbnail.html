<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DTFlow Design System</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin: 0; padding: 0; width: 1280px; height: 854px; display: flex; overflow: hidden; }
    .main { flex: 1; background: var(--color-accent); display: flex; align-items: center; justify-content: center; position: relative; }
    .mark { font-size: 180px; font-weight: 700; color: white; text-align: center; font-family: var(--font-family-ui); }
    .swatches { width: 240px; display: flex; flex-direction: column; }
    .swatch { flex: 1; border: 0; }
  </style>
</head>
<body>
  <div class="main">
    <img src="assets/dtflow-app.png" style="height:70%;border-radius:12%">
  </div>
  <div class="swatches">
    <div class="swatch" style="background: var(--color-accent);"></div>
    <div class="swatch" style="background: var(--color-success);"></div>
    <div class="swatch" style="background: var(--color-warning);"></div>
    <div class="swatch" style="background: var(--color-error);"></div>
  </div>
</body>
</html>
