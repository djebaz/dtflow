# Place at .github/dependabot.yml
version: 2
updates:
  # One uv entry (Dependabot rejects two entries for the same ecosystem and directory).
  # Weekly is enough (drawthings-py publishes about monthly); it is the base of every Draw Things connection and gets its own
  # PR, never grouped. Everything else is batched into one PR for minor and patch updates.
  # drawthings-py is bounded to 0.4.x in pyproject.toml, so a new line arrives as a PR to review by hand (see
  # devdocs/research/drawthings-grpc-proof.md before changing the bound or the NumPy override).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "drawthings-py"
    ignore:
      # NumPy 2.3.5 is pinned for legacy Windows CPU compatibility (NumPy 2.4+ failed to import).
      # Ignore routine updates, but leave Dependabot security update PRs eligible for review.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # Pillow 13 was owner-smoke-tested in the packaged Windows EXE (#385/#386), but overrides
      # drawthings-py 0.4.0's declared Pillow <13 cap; review security fixes for SDK compatibility.
      - dependency-name: "pillow"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
