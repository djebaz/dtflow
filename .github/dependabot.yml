# Place at .github/dependabot.yml
version: 2
updates:
  # Python dependencies managed by uv (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned on purpose by [tool.uv] override-dependencies: NumPy 2.4+ fails to import on the tested
      # legacy Windows CPU (see devdocs/research/drawthings-grpc-proof.md).
      - dependency-name: "numpy"
      # drawthings-py is bounded to 0.4.x; a new release line needs a manual compatibility review.
      - dependency-name: "drawthings-py"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
