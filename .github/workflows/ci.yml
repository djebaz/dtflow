# (adapted from your original file)
name: CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('CI manual · {0}',
  (inputs.sha != '' && format('commit {0}', inputs.sha))
  || (inputs.pr != '' && format('PR {0}', inputs.pr))
  || format('branch {0}', inputs.branch != '' && inputs.branch || github.event.repository.default_branch))
  || github.event_name == 'pull_request' && format('CI · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || format('CI · push to {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to check (full or short; wins over pr and branch)"
        required: false
        default: ""
        type: string
      pr:
        description: "Pull request number, or 'latest' for the highest-numbered open PR (head commit; wins over branch)"
        required: false
        default: ""
        type: string
      branch:
        description: "Branch to check (empty: the default branch, main)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - '**/*.py'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.py'

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  UV_LOCKED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  resolve:
    name: Resolve manual target
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      has_py: ${{ steps.pyfiles.outputs.has_py }}
    steps:
      - name: Resolve manual target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            repo="repos/$GITHUB_REPOSITORY"
            if [ -n "$INPUT_SHA" ]; then
              [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "sha must be 7 to 40 hex characters." >&2; exit 1; }
              what="commit $INPUT_SHA"
              sha=$(gh api "$repo/commits/$INPUT_SHA" --jq .sha)
            elif [ -n "$INPUT_PR" ]; then
              pr="$INPUT_PR"
              if [ "$pr" = "latest" ]; then
                pr=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq 'map(.number) | max // empty')
                [ -n "$pr" ] || { echo "No open pull request found." >&2; exit 1; }
              fi
              [[ "$pr" =~ ^[0-9]+$ ]] || { echo "pr must be a number or 'latest'." >&2; exit 1; }
              what="pull request #$pr"
              sha=$(gh api "$repo/pulls/$pr" --jq .head.sha)
            else
              branch="${INPUT_BRANCH:-$DEFAULT_BRANCH}"
              [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid branch name." >&2; exit 1; }
              what="branch $branch"
              sha=$(gh api "$repo/commits/$branch" --jq .sha)
            fi
            echo "Checking $what at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Check if this commit contains Python files
        id: pyfiles
        shell: bash
        run: |
          git ls-tree -r --name-only HEAD > "$RUNNER_TEMP/ci-files.txt"
          if grep -E '\.py$' "$RUNNER_TEMP/ci-files.txt" > /dev/null; then
            echo "has_py=true" >> "$GITHUB_OUTPUT"
            echo "This commit contains Python files."
          else
            echo "has_py=false" >> "$GITHUB_OUTPUT"
            echo "This commit does not contain Python files; skipping CI."
          fi

  format:
    name: Format (warnings)
    needs: resolve
    if: needs.resolve.outputs.has_py == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Mark commit pending (format)
        if: needs.resolve.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending -f context="CI · format (manual)" -f description="Format check in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Install Qt runtime library
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Lock file is current
        run: uv lock --check

      - name: Ruff format (check)
        # allow failures so this job can't block the workflow; we still show output
        run: uv run ruff format --check . || true

      - name: Report manual result (format)
        if: always() && needs.resolve.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; text="Format check passed" ;;
            cancelled) state=error; text="Format check cancelled" ;;
            *) state=failure; text="Format check found issues" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context="CI · format (manual)" -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  lint:
    name: Lint (warnings)
    needs: resolve
    if: needs.resolve.outputs.has_py == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Mark commit pending (lint)
        if: needs.resolve.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending -f context="CI · lint (manual)" -f description="Lint check in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Install Qt runtime library
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Ruff lint
        # allow failures so lint doesn't block the workflow
        run: uv run ruff check . || true

      - name: Report manual result (lint)
        if: always() && needs.resolve.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; text="Lint passed" ;;
            cancelled) state=error; text="Lint cancelled" ;;
            *) state=failure; text="Lint found issues" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context="CI · lint (manual)" -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  tests:
    name: Tests
    needs: resolve
    if: needs.resolve.outputs.has_py == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Mark commit pending (tests)
        if: needs.resolve.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending -f context="CI · tests (manual)" -f description="Tests in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Install Qt runtime library
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Lock file is current
        run: uv lock --check

      - name: SQLite version
        run: uv run python -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Pytest (offline)
        run: uv run pytest

      - name: Report manual result (tests)
        if: always() && needs.resolve.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; text="Tests passed" ;;
            cancelled) state=error; text="Tests cancelled" ;;
            *) state=failure; text="Tests failed" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context="CI · tests (manual)" -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
