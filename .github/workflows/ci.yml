name: CI

# What the run list shows: which event and target the run is about, instead of just "CI".
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('CI manual · {0}',
  (inputs.sha != '' && format('commit {0}', inputs.sha))
  || (inputs.pr != '' && format('PR {0}', inputs.pr))
  || format('branch {0}', inputs.branch != '' && inputs.branch || github.event.repository.default_branch))
  || github.event_name == 'pull_request' && format('CI · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || format('CI · push to {0}', github.ref_name) }}

# Offline checks only: lock consistency, lint, format and the offline pytest suite.
# Live Draw Things / DT+ tests and any generation are never run here, and no secrets are used.
# Runs on pushes to main (this seeds the uv cache: pull request caches are only readable by their own PR,
# while main's are shared with every PR), on non-draft pull requests (including when one is marked ready for
# review) and on manual dispatch, to limit runner minutes. Pushes to other branches are not checked.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to check (full or short; wins over pr and branch)"
        required: false
        default: ""
        type: string
      pr:
        description: "Pull request number, or 'latest' for the highest-numbered open PR (head commit; wins over branch)"
        required: false
        default: ""
        type: string
      branch:
        description: "Branch to check (empty: the default branch, main)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - '**/*.py'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.py'

# A newer push to the same pull request cancels the run in progress. Manual runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  UV_LOCKED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  checks:
    name: Lock, lint, test
    # Draft pull requests are skipped; marking one ready for review starts a run.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve manual target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Pull request and push events check out their own default ref; only manual runs pick a target.
          sha=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            repo="repos/$GITHUB_REPOSITORY"
            if [ -n "$INPUT_SHA" ]; then
              [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "sha must be 7 to 40 hex characters." >&2; exit 1; }
              what="commit $INPUT_SHA"
              sha=$(gh api "$repo/commits/$INPUT_SHA" --jq .sha)
            elif [ -n "$INPUT_PR" ]; then
              pr="$INPUT_PR"
              if [ "$pr" = "latest" ]; then
                pr=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq 'map(.number) | max // empty')
                [ -n "$pr" ] || { echo "No open pull request found." >&2; exit 1; }
              fi
              [[ "$pr" =~ ^[0-9]+$ ]] || { echo "pr must be a number or 'latest'." >&2; exit 1; }
              what="pull request #$pr"
              sha=$(gh api "$repo/pulls/$pr" --jq .head.sha)
            else
              branch="${INPUT_BRANCH:-$DEFAULT_BRANCH}"
              [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid branch name." >&2; exit 1; }
              what="branch $branch"
              sha=$(gh api "$repo/commits/$branch" --jq .sha)
            fi
            echo "Checking $what at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Mark commit pending
        if: steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending -f context="CI (manual)" -f description="Manual CI run in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Check if this commit contains Python files
        id: pyfiles
        shell: bash
        run: |
          if git ls-tree -r --name-only HEAD | grep -Eq '\.py$'; then
            echo "has_py=true" >> "$GITHUB_OUTPUT"
            echo "This commit contains Python files."
          else
            echo "has_py=false" >> "$GITHUB_OUTPUT"
            echo "This commit does not contain Python files; skipping CI."
          fi

      - name: Skip CI no Python files in this commit
        if: steps.pyfiles.outputs.has_py != 'true'
        run: echo "No .py files in this commit; skipping CI."

      # PySide6 needs libEGL at import time; the other Qt libraries are already on the runner image.
      # Billing rounds each job up to a whole minute, so skip the slow package index refresh unless the
      # install fails without it.
      - name: Install Qt runtime library
        if: steps.pyfiles.outputs.has_py == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.pyfiles.outputs.has_py == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv sync --locked

      - name: Lock file is current
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv lock --check

      - name: Ruff lint
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv run ruff check .

      - name: Ruff format
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv run ruff format --check .

      - name: SQLite version
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv run python -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Pytest (offline)
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv run pytest

      # Posts the final result on the checked commit so it shows in that PR's checks.
      - name: Report manual result
        if: always() && steps.target.outputs.sha != '' && steps.pyfiles.outputs.has_py == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; text="Manual CI run passed" ;;
            cancelled) state=error; text="Manual CI run was cancelled" ;;
            *) state=failure; text="Manual CI run failed" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context="CI (manual)" -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
