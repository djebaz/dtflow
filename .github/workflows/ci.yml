name: CI

# Offline checks only: lock consistency, lint, format and the offline pytest suite.
# Live Draw Things / DT+ tests and any generation are never run here, and no secrets are used.
# Runs on pushes to main (this seeds the uv cache: pull request caches are only readable by their own PR,
# while main's are shared with every PR), on non-draft pull requests (including when one is marked ready for
# review) and on manual dispatch, to limit runner minutes. Pushes to other branches are not checked.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number, or 'latest' for the highest-numbered open PR (empty: use the branch field)"
        required: false
        default: ""
        type: string
      branch:
        description: "Branch to check when no PR is given (empty: the default branch, main)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same pull request cancels the run in progress. Manual runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  UV_LOCKED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  checks:
    name: Lock, lint, test
    # Draft pull requests are skipped; marking one ready for review starts a run.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve manual target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Pull request events check out the default merge ref; only manual runs pick a target.
          ref=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_PR" = "latest" ]; then
              INPUT_PR=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq 'map(.number) | max // empty')
              [ -n "$INPUT_PR" ] || { echo "No open pull request found." >&2; exit 1; }
            fi
            if [ -n "$INPUT_PR" ]; then
              [[ "$INPUT_PR" =~ ^[0-9]+$ ]] || { echo "pr must be a number or 'latest'." >&2; exit 1; }
              ref="refs/pull/$INPUT_PR/head"
              echo "Checking pull request #$INPUT_PR" >> "$GITHUB_STEP_SUMMARY"
            else
              ref="${INPUT_BRANCH:-$DEFAULT_BRANCH}"
              echo "Checking branch $ref" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Lock file is current
        run: uv lock --check

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: SQLite version
        run: uv run python -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Pytest (offline)
        run: uv run pytest
