name: CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('CI manual · {0}',
  (inputs.sha != '' && format('commit {0}', inputs.sha))
  || (inputs.pr != '' && format('PR {0}', inputs.pr))
  || format('branch {0}', inputs.branch != '' && inputs.branch || github.event.repository.default_branch))
  || github.event_name == 'pull_request' && format('CI · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || format('CI · push to {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to check (full or short; wins over pr and branch)"
        required: false
        default: ""
        type: string
      pr:
        description: "Pull request number, or 'latest' for the highest-numbered open PR (head commit; wins over branch)"
        required: false
        default: ""
        type: string
      branch:
        description: "Branch to check (empty: the default branch, main)"
        required: false
        default: ""
        type: string
  # push:
    # branches: [main]
    # paths: &ci-paths
      # - '**/*.py'
      # - 'pyproject.toml'
      # - 'uv.lock'
      # - '.python-version'
      # - 'src/dtflow/**'
      # - 'tests/**'
      # - '.github/workflows/ci.yml'
  pull_request:
     types: [opened, synchronize, reopened, ready_for_review]
     # Native filtering allocates no runner for an entirely documentation-only PR.
     paths-ignore:
       - '**/*.md'
       - '**/*.rst'
       - 'LICENSE*'
       - 'NOTICE*'
       - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read
  pull-requests: write  # sticky Ruff warning comment
  statuses: write

env:
  UV_LOCKED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  checks:
    name: Lock, lint, test (single-runner)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # No shared pre-gate concurrency: an irrelevant update must not cancel running/pending checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # job-level token for gh
    steps:
      - name: Resolve manual target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=""
          pr_number=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            repo="repos/$GITHUB_REPOSITORY"
            if [ -n "$INPUT_SHA" ]; then
              [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "sha must be 7 to 40 hex characters." >&2; exit 1; }
              what="commit $INPUT_SHA"
              sha=$(gh api "$repo/commits/$INPUT_SHA" --jq .sha)
            elif [ -n "$INPUT_PR" ]; then
              pr="$INPUT_PR"
              if [ "$pr" = "latest" ]; then
                pr=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq 'map(.number) | max // empty')
                [ -n "$pr" ] || { echo "No open pull request found." >&2; exit 1; }
              fi
              [[ "$pr" =~ ^[0-9]+$ ]] || { echo "pr must be a number or 'latest'." >&2; exit 1; }
              what="pull request #$pr"
              sha=$(gh api "$repo/pulls/$pr" --jq .head.sha)
              pr_number="$pr"
            else
              branch="${INPUT_BRANCH:-$DEFAULT_BRANCH}"
              [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid branch name." >&2; exit 1; }
              what="branch $branch"
              sha=$(gh api "$repo/commits/$branch" --jq .sha)
            fi
            echo "Checking $what at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check this update before expensive setup
        id: changes
        run: |
          if [ -f tools/ci/action_changes.py ] && [ -f tools/ci/action_dependencies.json ]; then
            python3 tools/ci/action_changes.py --kind ci
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Change gate unavailable at target; run conservatively." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Shared environment setup (runs once)
      - name: Install Qt runtime library
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - name: Setup uv (cache enabled)
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        if: steps.changes.outputs.run == 'true'
        run: uv sync --locked

      - name: Lock file is current
        if: steps.changes.outputs.run == 'true'
        run: uv lock --check

      # Guard: only post statuses for same-repo PRs or non-PR runs (fork tokens are read-only)
      - name: Set status-allowed flag
        if: steps.changes.outputs.run == 'true'
        id: allow_status
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          allowed="true"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            allowed="false"
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      # ---------- Format and lint (non-blocking: warnings only) ----------
      - name: Ruff format (check, warnings only)
        if: steps.changes.outputs.run == 'true'
        id: format_run
        shell: bash
        run: |
          rc=0
          # GitHub format gives one annotation per file; downgrade them to warnings.
          uv run ruff format --check --output-format=github . > ruff-format.txt 2> ruff-format.err || rc=$?
          count=$(grep -c '^::error ' ruff-format.txt || true)
          sed 's/^::error /::warning /' ruff-format.txt
          cat ruff-format.err
          if [ "$rc" -gt 1 ]; then
            echo "::warning title=Ruff format::ruff format could not run (exit $rc); see log"
          fi
          {
            echo "### Ruff format"
            if [ "$rc" -eq 0 ]; then
              echo "Formatted correctly."
            else
              echo "⚠️ ${count} file(s) would be reformatted (non-blocking). Run \`uv run ruff format\`."
              echo '```'
              uv run ruff format --check --output-format=concise . 2>&1 | tee ruff-format-concise.txt | sed -n '1,200p' || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Ruff lint (warnings only)
        if: steps.changes.outputs.run == 'true'
        id: lint_run
        shell: bash
        run: |
          rc=0
          # GitHub format gives one annotation per finding; downgrade them to warnings.
          uv run ruff check --output-format=github . > ruff-lint.txt 2> ruff-lint.err || rc=$?
          count=$(grep -c '^::error ' ruff-lint.txt || true)
          sed 's/^::error /::warning /' ruff-lint.txt
          cat ruff-lint.err
          if [ "$rc" -gt 1 ]; then
            echo "::warning title=Ruff lint::ruff check could not run (exit $rc); see log"
          fi
          {
            echo "### Ruff lint"
            if [ "$rc" -eq 0 ]; then
              echo "No lint findings."
            else
              echo "⚠️ ${count} finding(s) (non-blocking)."
              echo '```'
              uv run ruff check --output-format=concise . 2>&1 | tee ruff-lint-concise.txt | sed -n '1,200p' || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Report format and lint results (non-blocking)
        if: steps.changes.outputs.run == 'true' && steps.target.outputs.sha != '' && steps.allow_status.outputs.allowed == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          FORMAT_RC: ${{ steps.format_run.outputs.rc }}
          FORMAT_COUNT: ${{ steps.format_run.outputs.count }}
          LINT_RC: ${{ steps.lint_run.outputs.rc }}
          LINT_COUNT: ${{ steps.lint_run.outputs.count }}
        run: |
          # Always success so the statuses never block; the description carries the warning.
          post() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
              -f state=success -f context="$1" -f description="$2" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          if [ "${FORMAT_RC:-0}" -eq 0 ]; then
            post "CI · format (manual)" "Format check passed"
          else
            post "CI · format (manual)" "Warning: ${FORMAT_COUNT:-?} file(s) need formatting (non-blocking)"
          fi
          if [ "${LINT_RC:-0}" -eq 0 ]; then
            post "CI · lint (manual)" "Lint passed"
          else
            post "CI · lint (manual)" "Warning: ${LINT_COUNT:-?} lint finding(s) (non-blocking)"
          fi

      # One PR comment, edited in place on every run, so warnings show on the Conversation tab.
      - name: Update Ruff warning comment on the PR (non-blocking)
        if: steps.changes.outputs.run == 'true' && steps.allow_status.outputs.allowed == 'true' && (github.event_name == 'pull_request' || steps.target.outputs.pr != '')
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || steps.target.outputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.target.outputs.sha }}
          FORMAT_RC: ${{ steps.format_run.outputs.rc }}
          FORMAT_COUNT: ${{ steps.format_run.outputs.count }}
          LINT_RC: ${{ steps.lint_run.outputs.rc }}
          LINT_COUNT: ${{ steps.lint_run.outputs.count }}
        shell: bash
        run: |
          marker="<!-- dtflow-ci-ruff -->"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "${FORMAT_RC:-0}" -eq 0 ] && [ "${LINT_RC:-0}" -eq 0 ]; then
            # Clean: only touch the PR if an earlier run left a warning comment.
            [ -n "$existing" ] || { echo "Ruff clean and no earlier comment; nothing to post."; exit 0; }
            printf '%s\n### ✅ Ruff: all clean\n\nFormat and lint pass on %s ([run](%s)).\n' \
              "$marker" "${HEAD_SHA:0:7}" "$run_url" > ruff-comment.md
          else
            {
              echo "$marker"
              echo "### ⚠️ Ruff warnings (non-blocking)"
              echo
              echo "On ${HEAD_SHA:0:7} ([run]($run_url)): **${FORMAT_COUNT:-?}** file(s) need formatting, **${LINT_COUNT:-?}** lint finding(s)."
              for kind in format lint; do
                f="ruff-$kind-concise.txt"
                [ -s "$f" ] || continue
                echo
                echo "<details><summary>ruff $kind</summary>"
                echo
                echo '```'
                grep -E '^[^ ].*:[0-9]+:[0-9]+: ' "$f" | sed -n '1,50p'
                echo '```'
                echo "</details>"
              done
              echo
              echo 'Fix locally with `uv run ruff format` and `uv run ruff check --fix`.'
            } > ruff-comment.md
          fi
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@ruff-comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@ruff-comment.md > /dev/null
          fi

      # ---------- Tests (blocking) ----------
      - name: Mark commit pending (tests)
        if: steps.changes.outputs.run == 'true' && steps.target.outputs.sha != '' && steps.allow_status.outputs.allowed == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending -f context="CI · tests (manual)" -f description="Tests in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: SQLite version
        if: steps.changes.outputs.run == 'true'
        run: uv run python -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Pytest (offline, parallel)
        if: steps.changes.outputs.run == 'true'
        run: uv run pytest -n auto

      - name: Report tests result
        # always(): otherwise a failed or cancelled run leaves the status pending forever.
        if: always() && steps.changes.outputs.run == 'true' && steps.target.outputs.sha != '' && steps.allow_status.outputs.allowed == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; text="Tests passed" ;;
            cancelled) state=error; text="Tests cancelled" ;;
            *) state=failure; text="Tests failed" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context="CI · tests (manual)" -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
