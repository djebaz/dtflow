name: CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('CI manual · {0}',
  (inputs.sha != '' && format('commit {0}', inputs.sha))
  || (inputs.pr != '' && format('PR {0}', inputs.pr))
  || format('branch {0}', inputs.branch != '' && inputs.branch || github.event.repository.default_branch))
  || github.event_name == 'pull_request' && format('CI · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || format('CI · push to {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to check (full or short; wins over pr and branch)"
        required: false
        default: ""
        type: string
      pr:
        description: "Pull request number, or 'latest' for the highest-numbered open PR (head commit; wins over branch)"
        required: false
        default: ""
        type: string
      branch:
        description: "Branch to check (empty: the default branch, main)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - '**/*.py'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.py'

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  UV_LOCKED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  checks:
    name: Lock, lint, test (single-runner)
    # Draft pull requests are skipped; marking one ready for review starts a run.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve manual target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            repo="repos/$GITHUB_REPOSITORY"
            if [ -n "$INPUT_SHA" ]; then
              [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "sha must be 7 to 40 hex characters." >&2; exit 1; }
              what="commit $INPUT_SHA"
              sha=$(gh api "$repo/commits/$INPUT_SHA" --jq .sha)
            elif [ -n "$INPUT_PR" ]; then
              pr="$INPUT_PR"
              if [ "$pr" = "latest" ]; then
                pr=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq 'map(.number) | max // empty')
                [ -n "$pr" ] || { echo "No open pull request found." >&2; exit 1; }
              fi
              [[ "$pr" =~ ^[0-9]+$ ]] || { echo "pr must be a number or 'latest'." >&2; exit 1; }
              what="pull request #$pr"
              sha=$(gh api "$repo/pulls/$pr" --jq .head.sha)
            else
              branch="${INPUT_BRANCH:-$DEFAULT_BRANCH}"
              [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid branch name." >&2; exit 1; }
              what="branch $branch"
              sha=$(gh api "$repo/commits/$branch" --jq .sha)
            fi
            echo "Checking $what at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Check if this commit contains Python files
        id: pyfiles
        shell: bash
        run: |
          git ls-tree -r --name-only HEAD > "$RUNNER_TEMP/ci-files.txt"
          if grep -E '\.py$' "$RUNNER_TEMP/ci-files.txt" > /dev/null; then
            echo "has_py=true" >> "$GITHUB_OUTPUT"
            echo "This commit contains Python files."
          else
            echo "has_py=false" >> "$GITHUB_OUTPUT"
            echo "This commit does not contain Python files; skipping CI."
          fi

      - name: Skip CI no Python files in this commit
        if: steps.pyfiles.outputs.has_py != 'true'
        run: echo "No .py files in this commit; skipping CI."

      # Shared environment setup (runs once)
      - name: Install Qt runtime library
        if: steps.pyfiles.outputs.has_py == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - name: Setup uv (cache enabled)
        if: steps.pyfiles.outputs.has_py == 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv sync --locked

      - name: Lock file is current
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv lock --check

      # ---------- Format check (non-blocking) ----------
      - name: Mark commit pending (format)
        if: steps.pyfiles.outputs.has_py == 'true' && steps.target.outputs.sha != ''
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending -f context="CI · format (manual)" -f description="Format check in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Ruff format (check)
        if: steps.pyfiles.outputs.has_py == 'true'
        id: format_run
        run: |
          rc=0
          uv run ruff format --check . > ruff-format.txt 2>&1 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "=== ruff format output ==="
          sed -n '1,200p' ruff-format.txt || true
        # do not fail the job if formatting issues are found
        continue-on-error: true

      - name: Report format result (non-blocking)
        if: steps.pyfiles.outputs.has_py == 'true' && steps.target.outputs.sha != ''
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          rc=${{ steps.format_run.outputs.rc }}
          if [ -z "$rc" ]; then rc=0; fi
          # We want format to be warnings/non-blocking: always set success so branch protections are not blocked.
          if [ "$rc" -eq 0 ]; then
            state=success
            desc="Format check passed"
          else
            state=success
            desc="Format check found issues (non-blocking — see action log)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context="CI · format (manual)" -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # ---------- Lint check (non-blocking) ----------
      - name: Mark commit pending (lint)
        if: steps.pyfiles.outputs.has_py == 'true' && steps.target.outputs.sha != ''
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending -f context="CI · lint (manual)" -f description="Lint check in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Ruff lint
        if: steps.pyfiles.outputs.has_py == 'true'
        id: lint_run
        run: |
          rc=0
          uv run ruff check . > ruff-lint.txt 2>&1 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "=== ruff lint output ==="
          sed -n '1,200p' ruff-lint.txt || true
        continue-on-error: true

      - name: Report lint result (non-blocking)
        if: steps.pyfiles.outputs.has_py == 'true' && steps.target.outputs.sha != ''
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          rc=${{ steps.lint_run.outputs.rc }}
          if [ -z "$rc" ]; then rc=0; fi
          # Keep lint non-blocking: always set success so branch protections are not blocked.
          if [ "$rc" -eq 0 ]; then
            state=success
            desc="Lint passed"
          else
            state=success
            desc="Lint found issues (non-blocking — see action log)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context="CI · lint (manual)" -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # ---------- Tests (blocking) ----------
      - name: Mark commit pending (tests)
        if: steps.pyfiles.outputs.has_py == 'true' && steps.target.outputs.sha != ''
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending -f context="CI · tests (manual)" -f description="Tests in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: SQLite version
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv run python -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Pytest (offline)
        if: steps.pyfiles.outputs.has_py == 'true'
        run: uv run pytest

      - name: Report tests result
        if: steps.pyfiles.outputs.has_py == 'true' && steps.target.outputs.sha != ''
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; text="Tests passed" ;;
            cancelled) state=error; text="Tests cancelled" ;;
            *) state=failure; text="Tests failed" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context="CI · tests (manual)" -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
