name: UI renders

# Renders the offline UI preview states and uploads the screenshots. Runs on manual dispatch for a chosen
# pull request, and on pushes/label additions with "render" or "render-all".
# Mapped selection uses render_changes.py, render_coverage.json and render_dependencies.json.
# "render-all", or a manual all-category dispatch without "changed_only", renders every state.
# tools/ui/render_states.py uses offline fixtures and a network guard; no provider traffic, generation or secrets.
run-name: >-
  UI renders · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || inputs.pr != '' && format('PR #{0}', inputs.pr) || format('branch {0}', github.ref_name) }}

on:
  # Label-only requests enter through render-request.yml, without a separate runner job.
  workflow_call:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to render (empty: the branch this workflow runs from)"
        required: false
        default: ""
        type: string
      category:
        description: "UI category to render"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - connection
          - generate
          - images
          - image-navigation
          - queues
          - shell
          - inpaint
          - logs
          - scripts
      changed_only:
        description: "With a PR and category all: render mapped representatives; uncertain impact uses a sample pack with a coverage warning"
        required: false
        default: false
        type: boolean
      upload_mode:
        description: "Google Drive upload format (images uploads every PNG with four workers)"
        required: true
        default: "zip"
        type: choice
        options:
          - zip
          - images
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/dtflow/**'
      - 'tools/ui/**'
      - 'tests/fixtures/**'
      - 'tests/helpers/**'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/actions/**'
      - '.github/workflows/main.yml'
      - '.github/workflows/render-request.yml'
      - 'tools/ci/action_changes.py'
      - 'tools/ci/action_dependencies.json'
      - '!**/*.md'
      - '!**/*.rst'

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  UV_LOCKED: "1"
  QT_QPA_PLATFORM: offscreen
  # Show each rendered file as it is written instead of buffering stdout until exit.
  PYTHONUNBUFFERED: "1"
  # On a fatal signal (including the hang watchdog below), print every thread's Python stack.
  PYTHONFAULTHANDLER: "1"

jobs:
  render:
    name: Render UI states
    runs-on: ubuntu-24.04
    # Either render label opts in; adding render-all works without a render label.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && (github.event.label.name == 'render' || github.event.label.name == 'render-all'))
      || (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'render') || contains(github.event.pull_request.labels.*.name, 'render-all')))
    # No shared pre-gate concurrency: irrelevant pushes must not cancel running/pending renders.
    timeout-minutes: 15
    steps:
      - name: Resolve target commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          sha="$GITHUB_SHA"
          label="branch $GITHUB_REF_NAME"
          if [ -n "$INPUT_PR" ]; then
            [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo "pr must be a positive number." >&2; exit 1; }
            pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
              echo "Only same-repository PR branches are supported; fork/deleted repositories are refused." >&2; exit 1; }
            sha=$(jq -r .head.sha <<<"$pr_json")
            label="PR #$INPUT_PR ($(jq -r .head.ref <<<"$pr_json"))"
            echo "base_ref=$(jq -r .base.ref <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          fi
          echo "Rendering $label at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          # The change-based selection diffs against the merge base with the target branch.
          fetch-depth: 0

      - name: Check this update before expensive setup
        id: changes
        run: |
          if [ -f tools/ci/action_changes.py ] && [ -f tools/ci/action_dependencies.json ]; then
            python3 tools/ci/action_changes.py --kind render
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Change gate unavailable at target; run conservatively." >> "$GITHUB_STEP_SUMMARY"
          fi

      # PySide6 needs libEGL at import time; the other Qt libraries and fonts are already on the runner image.
      - name: Install Qt runtime library
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.changes.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The render script imports the offline test fixtures, so the dev group is included.
      - name: Sync environment
        if: steps.changes.outputs.run == 'true'
        run: uv sync --locked

      # A normal run takes well under a minute. If a state hangs, the watchdog aborts Python
      # directly (not through uv) so the faulthandler stack shows exactly where it stalled.
      - name: Render states
        if: steps.changes.outputs.run == 'true'
        id: render
        # Longer than the 300s render deadline below, so the watchdog's stack traces appear before the step is cut.
        timeout-minutes: 6
        env:
          BASE_REF: ${{ steps.target.outputs.base_ref }}
          # Pull requests select by change unless labelled render-all; a manual dispatch must opt in.
          AUTO_SELECT: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'render-all')) || (github.event_name == 'workflow_dispatch' && inputs.changed_only && inputs.pr != '' && inputs.category == 'all') }}
        run: |
          mkdir -p tmp
          echo "Runner CPUs: $(nproc)"
          set -o pipefail
          status=0
          category="${{ inputs.category || 'all' }}"
          help_file=tmp/render-help.txt
          level_flag=""
          if ! .venv/bin/python tools/ui/render_states.py --help >"$help_file" 2>&1; then
            cat "$help_file"
            echo "::error::Renderer could not start; refusing to treat a broken renderer as a legacy renderer."
            status=1
          elif grep -q -- '--category' "$help_file"; then
            # Run levels default to fast; Actions renders every state when the target supports levels.
            if grep -q -- '--slow' "$help_file"; then level_flag="-s"; fi
            if [ "$category" = "all" ]; then
              selection_args="$level_flag"
              if [ "$AUTO_SELECT" = "true" ] && [ -f tools/ui/render_changes.py ]; then
                if .venv/bin/python tools/ui/render_changes.py --base "origin/${BASE_REF:-main}" --head HEAD \
                    --json tmp/render-selection.json | tee tmp/render-selection.txt; then
                  selection_args=$(python3 -c "import json;print(' '.join(json.load(open('tmp/render-selection.json'))['args']))")
                else
                  echo "::error::Selection planner failed; refusing silent exhaustive rendering. See selection output."
                  exit 1
                fi
              fi
              # The launcher splits the states over parallel Qt worker processes and merges their manifests.
              # shellcheck disable=SC2086  # selection_args is a space-separated list of simple flags
              timeout --signal=ABRT --kill-after=10s 300s \
                .venv/bin/python tools/ui/render_states.py $selection_args --out tmp/ui-renders \
                2>&1 | tee tmp/render.log || status=$?
            else
              timeout --signal=ABRT --kill-after=10s 300s \
                .venv/bin/python tools/ui/render_states.py --out tmp/ui-renders --category "$category" \
                2>&1 | tee tmp/render.log || status=$?
            fi
          else
            echo "::notice::Target commit predates category-aware rendering; rendering all states once."
            timeout --signal=ABRT --kill-after=10s 300s \
              .venv/bin/python tools/ui/render_states.py $level_flag --out tmp/ui-renders \
              2>&1 | tee tmp/render.log || status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 124 ] || [ "$status" -eq 134 ]; then
            echo "::error::Render timed out after 300s; see the stack trace above."
          fi
          exit "$status"

      - name: Upload renders to Google Drive
        id: drive
        if: always() && steps.changes.outputs.run == 'true'
        env:
          REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          UPLOAD_MODE: ${{ inputs.upload_mode || 'zip' }}
        run: |
          if ! find tmp/ui-renders -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo "No render PNGs were produced; skipping Drive upload."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in REFRESH_TOKEN CLIENT_ID CLIENT_SECRET; do
            [ -n "${!name}" ] || { echo "::error::Google Drive OAuth secret $name is not configured."; exit 1; }
          done
          label=${PR_NUMBER:+pr$PR_NUMBER-}
          run_folder="${label}$(date -u +%Y%m%dT%H%M%SZ)-${{ steps.target.outputs.short }}"
          upload_args=(--mode "$UPLOAD_MODE")
          case "$UPLOAD_MODE" in
            zip)
              archive="tmp/ui-renders-${run_folder}.zip"
              (cd tmp/ui-renders && zip -qr "../../$archive" .)
              upload_args+=(--archive "$archive")
              ;;
            images) ;;
            *) echo "::error::Unsupported upload mode: $UPLOAD_MODE"; exit 1 ;;
          esac
          uv run python tools/ci/upload_ui_renders_to_drive.py \
            --source tmp/ui-renders \
            "${upload_args[@]}" \
            --refresh-token "$REFRESH_TOKEN" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --run-folder "$run_folder" \
            --manifest tmp/ui-renders-drive.json
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # Built only from what this run produced (the merged render manifest, log and PNG files), so it
      # needs no upkeep when states are added or removed.
      - name: Summarize renders
        if: always() && steps.changes.outputs.run == 'true'
        env:
          RENDER_STATUS: ${{ steps.render.outputs.status }}
          TARGET: ${{ steps.target.outputs.label }}
          SHA: ${{ steps.target.outputs.sha }}
          DRIVE_UPLOADED: ${{ steps.drive.outputs.uploaded }}
        shell: python3 {0}
        run: |
          import json, os, re, struct
          from collections import Counter
          from pathlib import Path

          out, log_path = Path("tmp/ui-renders"), Path("tmp/render.log")
          raw_log = log_path.read_text(errors="replace").splitlines() if log_path.exists() else []
          log = raw_log
          manifest = {}
          candidates = sorted(out.glob("render-manifest-*.json")) if out.exists() else []
          for candidate in candidates:
              try:
                  data = json.loads(candidate.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              if "workers" in data:
                  manifest = data
          pngs = sorted(out.rglob("*.png")) if out.exists() else []
          status = os.environ.get("RENDER_STATUS", "")
          manifest_path = Path("tmp/ui-renders-drive.json")
          drive = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.exists() else {}
          drive_files = {item["relative_path"]: item for item in drive.get("files", [])}
          verdict = {
              "0": "✅ Passed",
              "124": "⏱️ Timed out (watchdog)",
              "134": "⏱️ Timed out (watchdog)",
              "": "⚠️ Did not run",
          }.get(status, f"❌ Failed (exit {status})")

          categories = {Path(row["path"]).name: row["category"] for row in manifest.get("states", []) if "category" in row}

          def size(path):
              with path.open("rb") as handle:
                  head = handle.read(24)
              return struct.unpack(">II", head[16:24]) if head[:8] == b"\x89PNG\r\n\x1a\n" else (0, 0)

          # Accept tab-first names and retain compatibility with older numbered renders.
          def area(path):
              if path.relative_to(out).parts[:1] == ("image-navigation",):
                  return "Image Navigation"
              if path.stem.startswith("scripts_"):
                  return "Scripts"
              if path.name in categories:
                  return categories[path.name]
              parts = path.stem.split("-", 2)
              if len(parts) == 3 and parts[1].isdigit():
                  return parts[0]
              return parts[1] if len(parts) > 1 and parts[0].isdigit() else "other"

          # State durations are measured inside each worker process.
          gaps = [(row["duration_seconds"], row["id"]) for row in manifest.get("states", []) if "duration_seconds" in row]
          selection_path = Path("tmp/render-selection.json")
          selection = json.loads(selection_path.read_text(encoding="utf-8")) if selection_path.exists() else {}
          workers = manifest.get("workers", {})
          timeouts = manifest.get("wait_timeouts", [])

          notes = [
              line.strip() for line in log
              if line.strip() and not line.strip().endswith(".png")
              and "does not support" not in line and not line.startswith(("Rendered ", "["))
          ]
          finals = [line for line in log if line.startswith("Rendered ")]
          problems = [
              line for line in log
              if line.startswith((
                  "Blank renders", "Failed workers", "Selected states not saved", "States rendered by more",
                  "Traceback", "RuntimeError", "Fatal Python", "WARNING",
              ))
          ]

          md = [f"## UI renders · {verdict}", ""]
          md += [
              "| | |", "|---|---|",
              f"| Target | {os.environ.get('TARGET') or '?'} |",
              f"| Commit | `{os.environ.get('SHA', '')[:7]}` |",
              f"| States rendered | **{len(pngs)}** |",
          ]
          if finals:
              md.append(f"| Script result | {'; '.join(finals)} |")
          if selection:
              md.append(f"| Selection | {selection['mode']}, {len(selection['changed'])} changed paths |")
              if selection.get("states"):
                  md.append(f"| Planned screenshots | {len(selection['states'])} distinct states |")
                  md.append(f"| Fixture setup | {len(selection.get('fixtures', []))} groups; setup may execute unselected transitions |")
              if selection.get("packs"):
                  md.append(f"| Representative packs | {', '.join(selection['packs'])} |")
          if drive.get("folder_url"):
              md.append(f"| Screenshots | [Google Drive folder]({drive['folder_url']}) |")
          if (drive.get("archive") or {}).get("view_url"):
              md.append(f"| Archive | [Download ZIP]({drive['archive']['view_url']}) |")
          if drive.get("mode"):
              md.append(f"| Drive upload mode | {drive['mode']} |")
          md.append("")
          if drive.get("failures"):
              md += ["### Drive upload failures", ""]
              md += [f"- {item['relative_path']}: {item['error']}" for item in drive["failures"]]
              md.append("")
          if problems:
              md += ["### Problems", "", "```", *problems[-20:], "```", ""]
          if pngs:
              # Group singleton areas together, including older unprefixed state names.
              counts = Counter(area(p) for p in pngs)
              single = [p.relative_to(out).as_posix() for p in pngs if counts[area(p)] == 1]
              md += ["### States by area", "", "| Area | States |", "|---|---:|"]
              md += [f"| {name} | {count} |" for name, count in counts.most_common() if count > 1]
              if single:
                  md.append(f"| other ({', '.join(single)}) | {len(single)} |")
              md.append("")
              # Keep the inline review compact: one representative state per area,
              # then fill remaining slots with Image Navigation renders, up to 12.
              representatives = []
              seen_areas = set()
              for path in pngs:
                  group = area(path)
                  if group not in seen_areas:
                      representatives.append(path)
                      seen_areas.add(group)
              navigation_candidates = [p for p in pngs if area(p) == "Image Navigation"]
              preview = representatives[:12]
              for path in navigation_candidates:
                  if path not in preview and len(preview) < 12:
                      preview.append(path)
              preview = [p for p in preview if p.relative_to(out).as_posix() in drive_files]
              if preview:
                  md += ["### Visual preview", ""]
                  for path in preview:
                      relative = path.relative_to(out).as_posix()
                      item = drive_files[relative]
                      md += [
                          f"**{relative}**",
                          "",
                          f"[![{relative}]({item['content_url']})]({item['view_url']})",
                          "",
                      ]

              navigation = [p for p in pngs if area(p) == "Image Navigation"]
              if navigation:
                  md += [
                      "### Image Navigation — review these together", "",
                      f"Folder in artifact: `image-navigation/` · **{len(navigation)} screenshots**", "",
                      "| Screenshot | Resolution | KB |", "|---|---|---:|",
                  ]
                  for path in navigation:
                      width, height = size(path)
                      md.append(f"| {path.name} | {width}×{height} | {path.stat().st_size // 1024} |")
                  md.append("")
          if selection:
              if selection.get("warnings"):
                  md += ["", "**⚠ Coverage incomplete: representative sampling, not exhaustive coverage.**", ""]
                  md += [f"- {warning}" for warning in selection["warnings"][:8]]
                  md.append("")
              md += ["<details><summary>Why these states were selected</summary>", "", "```", *selection["reasons"][:80], "```", "</details>", ""]
              if selection.get("states"):
                  md += ["<details><summary>Exact planned states and fixture setup</summary>", "", "```", *selection["states"], "", "Fixture groups:", *selection.get("fixtures", []), "```", "</details>", ""]
          if workers:
              md += ["### Workers", "", "| Worker | Seconds | Exit |", "|---|---:|---:|"]
              md += [f"| {name} | {item['elapsed_seconds']:.1f} | {item['exit_code']} |" for name, item in workers.items()]
              md.append("")
          if timeouts:
              md += [f"### Fixture waits timed out ({len(timeouts)})", "", ", ".join(f"`{name}`" for name in timeouts), ""]
          if gaps:
              md += ["### Slowest states", "", "| State | Seconds |", "|---|---:|"]
              md += [f"| {name} | {gap:.1f} |" for gap, name in sorted(gaps, reverse=True)[:5]]
              md.append("")
          if pngs:
              md += ["<details><summary>All rendered states</summary>", "", "| State | Size | KB |", "|---|---|---:|"]
              for path in pngs:
                  width, height = size(path)
                  md.append(f"| {path.relative_to(out).as_posix()} | {width}×{height} | {path.stat().st_size // 1024} |")
              md += ["", "</details>", ""]
          if notes:
              md += ["<details><summary>Script messages (fixtures log expected failures on purpose)</summary>", "", "```"]
              md += [*notes[:60], "```", "</details>", ""]
          md.append("_Offscreen layout evidence only, not Windows or DPI acceptance._")
          rendered_summary = "\n".join(md) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(rendered_summary)
          Path("tmp/ui-render-summary.md").write_text(rendered_summary, encoding="utf-8")
          print(f"{verdict}: {len(pngs)} states rendered.")

      - name: Update pull request render comment
        if: always() && steps.changes.outputs.run == 'true' && (github.event.pull_request.number || inputs.pr)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          summary=tmp/ui-render-summary.md
          [ -f "$summary" ] || exit 0
          marker='<!-- dtflow-ui-renders -->'
          body_file=tmp/ui-render-comment.md
          {
            echo "$marker"
            cat "$summary"
            echo
            echo "_Updated by the UI renders workflow; reruns replace this comment._"
          } > "$body_file"

          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- dtflow-ui-renders -->"))) | .id' \
            | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --raw-field "body=$(cat "$body_file")" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --raw-field "body=$(cat "$body_file")" >/dev/null
          fi
