name: UI renders

# Renders the offline UI preview states and uploads the screenshots. Runs on manual dispatch for a chosen
# pull request, and automatically on every push to a pull request labelled "render" (and when the label is added).
# tools/ui/render_states.py uses offline fixtures and a network guard; no provider traffic, generation or secrets.
run-name: >-
  UI renders · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || inputs.pr != '' && format('PR #{0}', inputs.pr) || format('branch {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to render (empty: the branch this workflow runs from)"
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A newer push or dispatch for the same pull request cancels the render in progress.
concurrency:
  group: ui-renders-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  UV_LOCKED: "1"
  QT_QPA_PLATFORM: offscreen
  # Show each rendered file as it is written instead of buffering stdout until exit.
  PYTHONUNBUFFERED: "1"
  # On a fatal signal (including the hang watchdog below), print every thread's Python stack.
  PYTHONFAULTHANDLER: "1"

jobs:
  render:
    name: Render UI states
    runs-on: ubuntu-24.04
    # Pull request events run only when the PR carries the "render" label; adding any other label does nothing.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'render')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'render'))
    timeout-minutes: 15
    steps:
      - name: Resolve target commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          sha="$GITHUB_SHA"
          label="branch $GITHUB_REF_NAME"
          if [ -n "$INPUT_PR" ]; then
            [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo "pr must be a positive number." >&2; exit 1; }
            pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
              echo "Only same-repository PR branches are supported; fork/deleted repositories are refused." >&2; exit 1; }
            sha=$(jq -r .head.sha <<<"$pr_json")
            label="PR #$INPUT_PR ($(jq -r .head.ref <<<"$pr_json"))"
          fi
          echo "Rendering $label at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      # PySide6 needs libEGL at import time; the other Qt libraries and fonts are already on the runner image.
      - name: Install Qt runtime library
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The render script imports the offline test fixtures, so the dev group is included.
      - name: Sync environment
        run: uv sync --locked

      # A normal run takes well under a minute. If a state hangs, the watchdog aborts Python
      # directly (not through uv) so the faulthandler stack shows exactly where it stalled.
      - name: Render states
        id: render
        timeout-minutes: 2
        run: |
          mkdir -p tmp
          set -o pipefail
          status=0
          timeout --signal=ABRT --kill-after=10s 300s .venv/bin/python tools/ui/render_states.py --out tmp/ui-renders \
            2>&1 | tee tmp/render.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 124 ] || [ "$status" -eq 134 ]; then
            echo "::error::Render timed out after 300s; see the stack trace above."
          fi
          exit "$status"

      - name: Upload renders
        id: upload
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-renders-${{ (github.event.pull_request.number || inputs.pr) && format('pr{0}', github.event.pull_request.number || inputs.pr) || 'branch' }}-${{ steps.target.outputs.short }}
          path: tmp/ui-renders/
          if-no-files-found: warn
          retention-days: 14

      # Built only from what this run produced (the render log and PNG files), so it needs no upkeep
      # when states are added or removed.
      - name: Summarize renders
        if: always()
        env:
          RENDER_STATUS: ${{ steps.render.outputs.status }}
          TARGET: ${{ steps.target.outputs.label }}
          SHA: ${{ steps.target.outputs.sha }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: python3 {0}
        run: |
          import os, re, struct
          from collections import Counter
          from pathlib import Path

          out, log_path = Path("tmp/ui-renders"), Path("tmp/render.log")
          log = log_path.read_text(errors="replace").splitlines() if log_path.exists() else []
          pngs = sorted(out.rglob("*.png")) if out.exists() else []
          status = os.environ.get("RENDER_STATUS", "")
          verdict = {
              "0": "✅ Passed",
              "124": "⏱️ Timed out (watchdog)",
              "134": "⏱️ Timed out (watchdog)",
              "": "⚠️ Did not run",
          }.get(status, f"❌ Failed (exit {status})")

          def size(path):
              with path.open("rb") as handle:
                  head = handle.read(24)
              return struct.unpack(">II", head[16:24]) if head[:8] == b"\x89PNG\r\n\x1a\n" else (0, 0)

          # Accept tab-first names and retain compatibility with older numbered renders.
          def area(path):
              if path.relative_to(out).parts[:1] == ("image-navigation",):
                  return "Image Navigation"
              parts = path.stem.split("-", 2)
              if len(parts) == 3 and parts[1].isdigit():
                  return parts[0]
              return parts[1] if len(parts) > 1 and parts[0].isdigit() else "other"

          # Seconds since start, from the script's "[  n] +12.3s path" progress lines when present.
          times = {}
          for line in log:
              match = re.match(r"\[\s*\d+\]\s+\+\s*([\d.]+)s\s+(\S+\.png)$", line.strip())
              if match:
                  times[Path(match[2]).stem] = float(match[1])
          gaps, previous = [], 0.0
          for name, seconds in times.items():
              gaps.append((seconds - previous, name))
              previous = seconds

          notes = [
              line.strip() for line in log
              if line.strip() and not line.strip().endswith(".png")
              and "does not support" not in line and not line.startswith(("Rendered ", "["))
          ]
          final = next((line for line in reversed(log) if line.startswith("Rendered ")), None)
          problems = [line for line in log if line.startswith(("Blank renders", "Traceback", "RuntimeError", "Fatal Python"))]

          md = [f"## UI renders · {verdict}", ""]
          md += [
              "| | |", "|---|---|",
              f"| Target | {os.environ.get('TARGET') or '?'} |",
              f"| Commit | `{os.environ.get('SHA', '')[:7]}` |",
              f"| States rendered | **{len(pngs)}** |",
          ]
          if final:
              md.append(f"| Script result | {final} |")
          if os.environ.get("ARTIFACT_URL"):
              md.append(f"| Screenshots | [Download the zip]({os.environ['ARTIFACT_URL']}) |")
          md.append("")
          if problems:
              md += ["### Problems", "", "```", *problems[-20:], "```", ""]
          if pngs:
              # Group singleton areas together, including older unprefixed state names.
              counts = Counter(area(p) for p in pngs)
              single = [p.relative_to(out).as_posix() for p in pngs if counts[area(p)] == 1]
              md += ["### States by area", "", "| Area | States |", "|---|---:|"]
              md += [f"| {name} | {count} |" for name, count in counts.most_common() if count > 1]
              if single:
                  md.append(f"| other ({', '.join(single)}) | {len(single)} |")
              md.append("")
              navigation = [p for p in pngs if area(p) == "Image Navigation"]
              if navigation:
                  md += [
                      "### Image Navigation — review these together", "",
                      f"Folder in artifact: `image-navigation/` · **{len(navigation)} screenshots**", "",
                      "| Screenshot | Resolution | KB |", "|---|---|---:|",
                  ]
                  for path in navigation:
                      width, height = size(path)
                      md.append(f"| {path.name} | {width}×{height} | {path.stat().st_size // 1024} |")
                  md.append("")
          if gaps:
              md += ["### Slowest states", "", "| State | Seconds |", "|---|---:|"]
              md += [f"| {name} | {gap:.1f} |" for gap, name in sorted(gaps, reverse=True)[:5]]
              md.append("")
          if pngs:
              md += ["<details><summary>All rendered states</summary>", "", "| State | Size | KB |", "|---|---|---:|"]
              for path in pngs:
                  width, height = size(path)
                  md.append(f"| {path.relative_to(out).as_posix()} | {width}×{height} | {path.stat().st_size // 1024} |")
              md += ["", "</details>", ""]
          if notes:
              md += ["<details><summary>Script messages (fixtures log expected failures on purpose)</summary>", "", "```"]
              md += [*notes[:60], "```", "</details>", ""]
          md.append("_Offscreen layout evidence only, not Windows or DPI acceptance._")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(md) + "\n")
          print(f"{verdict}: {len(pngs)} states rendered.")
