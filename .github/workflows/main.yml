name: UI renders

# Manual only: render the offline UI preview states for a chosen pull request and upload the screenshots.
# tools/ui/render_states.py uses offline fixtures and a network guard; no provider traffic, generation or secrets.
run-name: >-
  UI renders · ${{ inputs.pr != '' && format('PR #{0}', inputs.pr) || format('branch {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to render (empty: the branch this workflow runs from)"
        required: false
        default: ""
        type: string

concurrency:
  group: ui-renders-${{ inputs.pr != '' && inputs.pr || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  UV_LOCKED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  render:
    name: Render UI states
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve target commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          sha="$GITHUB_SHA"
          label="branch $GITHUB_REF_NAME"
          if [ -n "$INPUT_PR" ]; then
            [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo "pr must be a positive number." >&2; exit 1; }
            pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
              echo "Only same-repository PR branches are supported; fork/deleted repositories are refused." >&2; exit 1; }
            sha=$(jq -r .head.sha <<<"$pr_json")
            label="PR #$INPUT_PR ($(jq -r .head.ref <<<"$pr_json"))"
          fi
          echo "Rendering $label at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      # PySide6 needs libEGL at import time; the other Qt libraries and fonts are already on the runner image.
      - name: Install Qt runtime library
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The render script imports the offline test fixtures, so the dev group is included.
      - name: Sync environment
        run: uv sync --locked

      - name: Render states
        run: uv run python tools/ui/render_states.py --out tmp/ui-renders

      - name: Summarize renders
        if: always()
        run: |
          count=$(find tmp/ui-renders -type f -name '*.png' 2>/dev/null | wc -l)
          echo "Rendered $count PNG file(s). Offscreen layout evidence only, not Windows or DPI acceptance." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-renders-${{ inputs.pr != '' && format('pr{0}', inputs.pr) || 'branch' }}-${{ steps.target.outputs.short }}
          path: tmp/ui-renders/
          if-no-files-found: warn
          retention-days: 14
