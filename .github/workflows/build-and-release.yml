name: Build Windows EXE and draft release
run-name: >-
  Windows build · ${{ inputs.pr && format('PR #{0}', inputs.pr) || inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional same-repository PR number: build its exact head commit, artifact only."
        type: string
        required: false
        default: ""
      release_tag:
        description: "Optional existing vX.Y.Z tag: attach to a draft release. Empty: build only."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: windows-build-${{ inputs.pr && format('pr-{0}', inputs.pr) || inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    name: Build clean Windows x64 GUI
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.verify.outputs.artifact }}
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      drive_files: ${{ steps.drive.outputs.files }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate inputs and resolve exact source
        id: select
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_PR: ${{ inputs.pr }}
          WORKFLOW_SOURCE: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:SOURCE_PR -and $env:RELEASE_TAG) {
            throw "PR builds are artifact-only: pr and release_tag cannot be combined."
          }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected an existing stable vX.Y.Z tag, or empty for build-only."
          }
          $source = $env:WORKFLOW_SOURCE
          if ($env:SOURCE_PR) {
            if ($env:SOURCE_PR -notmatch '^[1-9][0-9]*$') { throw "PR must be a positive number." }
            $json = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:SOURCE_PR"
            if ($LASTEXITCODE) { throw "Cannot resolve the requested PR." }
            $pr = $json | ConvertFrom-Json
            if ($pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY) {
              throw "Only same-repository PR branches are supported; fork/deleted repositories are refused."
            }
            if ($pr.head.sha -notmatch '^[0-9a-f]{40}$') { throw "Invalid PR head commit." }
            $source = $pr.head.sha
            "PR #$env:SOURCE_PR branch: $($pr.head.ref); resolved head: $source; artifact only." |
              Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } elseif ($env:RELEASE_TAG) {
            $source = "refs/tags/$env:RELEASE_TAG"
          }
          "source_ref=$source" | Add-Content $env:GITHUB_OUTPUT -Encoding utf8

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.select.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard source and release; prepare dependency cache fingerprint
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SOURCE_PR: ${{ inputs.pr }}
          SELECTED_SOURCE: ${{ steps.select.outputs.source_ref }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE) { throw "Cannot identify checkout." }
          if (git status --porcelain --untracked-files=no) { throw "Build requires a clean checkout." }
          if ($env:SOURCE_PR -and $commit -ne $env:SELECTED_SOURCE) { throw "Checkout differs from resolved PR head." }
          if ($env:RELEASE_TAG) {
            $tagCommit = git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}"
            if ($LASTEXITCODE -or $tagCommit -ne $commit) { throw "Checkout must match the exact tag." }
            git merge-base --is-ancestor $commit origin/main
            if ($LASTEXITCODE) { throw "Release commit must be merged into main." }
            $json = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp
            if ($LASTEXITCODE) { throw "Cannot inspect existing releases." }
            foreach ($page in ($json | ConvertFrom-Json)) {
              foreach ($release in $page) {
                if ($release.tag_name -eq $env:RELEASE_TAG -and -not $release.draft) {
                  throw "Refusing to rebuild/replace an already published release."
                }
              }
            }
          }
          "commit=$commit" | Add-Content $env:GITHUB_OUTPUT -Encoding utf8
          "Workflow: $env:WORKFLOW_REF; source: $commit" | Add-Content $env:GITHUB_STEP_SUMMARY
          New-Item -ItemType Directory -Path tmp -Force | Out-Null
          $lock = Get-Content uv.lock -Raw
          # Normalize ONLY our version in a scratch fingerprint, never edit uv.lock.
          $pattern = '(?m)(^name = "dtflow"\r?\nversion = ")[^"]+(")'
          if ([regex]::Matches($lock, $pattern).Count -ne 1) { throw "Cannot identify project lock entry." }
          $fingerprint = [regex]::Replace($lock, $pattern, '${1}<app-version>${2}')
          Set-Content tmp/build-dependency-cache.txt $fingerprint -NoNewline -Encoding utf8

      - name: Set up cached uv and managed Python
        id: uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.13.13"
          enable-cache: true
          cache-python: true
          prune-cache: false
          cache-dependency-glob: tmp/build-dependency-cache.txt
          cache-suffix: dtflow-build-uv01119-py31313-pyinstaller6223-${{ inputs.pr && format('pr-{0}', inputs.pr) || 'trusted' }}

      - name: Synchronize locked runtime dependencies
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          uv sync --locked --no-dev
          if ($LASTEXITCODE) { throw "Locked sync failed." }
          uv lock --check
          if ($LASTEXITCODE) { throw "Lock consistency failed." }
          $version = uv version --short
          if ($LASTEXITCODE) { throw "Cannot read application version." }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") {
            throw "Source version and release tag disagree."
          }
          if ($env:RELEASE_TAG -and -not (Test-Path "devdocs/releases/$($env:RELEASE_TAG).md")) {
            throw "Versioned release notes are missing."
          }

      - name: Build through the canonical GUI builder
        run: |
          uv run --no-dev --with pyinstaller==6.22.3 python tools/packaging/build_exe.py
          if ($LASTEXITCODE) { throw "GUI build failed." }

      - name: Verify bundled identity and write checksums/manifest
        id: verify
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          DTFLOW_SOURCE_PR: ${{ inputs.pr }}
          DTFLOW_SOURCE_REF: ${{ steps.select.outputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          uv run --no-dev --with pyinstaller==6.22.3 python tools/packaging/release_artifact.py --commit $env:SOURCE_COMMIT --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw "Artifact verification failed." }
          if (git status --porcelain --untracked-files=no) { throw "Build changed tracked files." }
          $manifest = Get-Content dist/build-manifest.json -Raw | ConvertFrom-Json
          @(
            "Artifact: $($manifest.artifact)"
            "SHA256: $($manifest.sha256)"
            "Size: $($manifest.size_bytes) bytes"
            "uv dependency cache hit: ${{ steps.uv.outputs.cache-hit }}"
            "Python cache hit: ${{ steps.uv.outputs.python-cache-hit }}"
            "Owner Windows smoke: pending. Build success is not runtime acceptance."
          ) | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # Use the uploader from this workflow revision, even when building an older tag/PR.
      - name: Check out trusted Drive uploader
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-workflow
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Upload download-ready build to Google Drive
        id: drive
        shell: uv run --no-sync python {0}
        env:
          REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ARTIFACT: ${{ steps.verify.outputs.artifact }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("trusted-workflow/tools/ci").resolve()))
          from upload_ui_renders_to_drive import find_or_create_folder, get_access_token, upload_file

          for name in ("REFRESH_TOKEN", "CLIENT_ID", "CLIENT_SECRET"):
              if not os.environ.get(name):
                  raise SystemExit(f"Google Drive OAuth secret {name} is not configured.")
          names = (os.environ["ARTIFACT"], "SHA256SUMS.txt", "build-manifest.json")
          if any(Path(name).name != name or not (Path("dist") / name).is_file() for name in names):
              raise SystemExit("Expected three flat build files.")
          token = get_access_token(*(os.environ[name] for name in ("REFRESH_TOKEN", "CLIENT_ID", "CLIENT_SECRET")))
          root_id, _ = find_or_create_folder(token, "dtflow_windows_builds")
          label = f"build-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-{os.environ['SOURCE_COMMIT'][:7]}"
          folder_id, folder_url = find_or_create_folder(token, label, root_id)
          folder_url = folder_url or f"https://drive.google.com/drive/folders/{folder_id}"
          files = []
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"\n## Build downloads\n\nGoogle Drive folder: {folder_url}\n\n")
              for name in names:
                  path = Path("dist") / name
                  with path.open("rb") as handle:
                      digest = hashlib.file_digest(handle, "sha256").hexdigest()
                  item = upload_file(token, path, folder_id, name)
                  if not re.fullmatch(r"[a-zA-Z0-9_-]+", item["id"]):
                      raise SystemExit("Google Drive returned an invalid file ID.")
                  files.append({"name": name, "id": item["id"], "sha256": digest})
                  summary.write(f"- [{name}]({item['view_url']}) — SHA256 `{digest}`\n")
              summary.write("\nThree individual, link-readable files, like UI renders. No Actions artifact storage or automatic 14-day expiry.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"files={json.dumps(files)}\n")

  draft:
    name: Attach verified build to draft only
    if: inputs.release_tag != '' && inputs.pr == ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Download and verify individual build files from Google Drive
        env:
          REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          DRIVE_FILES: ${{ needs.build.outputs.drive_files }}
          EXPECTED_ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          foreach ($name in @('REFRESH_TOKEN', 'CLIENT_ID', 'CLIENT_SECRET')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Google Drive OAuth secret $name is not configured."
            }
          }
          $files = @($env:DRIVE_FILES | ConvertFrom-Json)
          $expected = @($env:EXPECTED_ARTIFACT, 'SHA256SUMS.txt', 'build-manifest.json')
          if ([IO.Path]::GetFileName($env:EXPECTED_ARTIFACT) -ne $env:EXPECTED_ARTIFACT -or
              $files.Count -ne 3 -or @($files.name | Select-Object -Unique).Count -ne 3) {
            throw "Expected three flat build files."
          }
          foreach ($file in $files) {
            if ($file.name -cnotin $expected -or $file.id -notmatch '^[a-zA-Z0-9_-]+$' -or
                $file.sha256 -notmatch '^[a-f0-9]{64}$') {
              throw "Invalid Google Drive transfer identity."
            }
          }
          New-Item -ItemType Directory -Path release-artifact -ErrorAction Stop | Out-Null
          try {
            $token = Invoke-RestMethod -Uri 'https://oauth2.googleapis.com/token' -Method Post -Body @{
              grant_type = 'refresh_token'
              refresh_token = $env:REFRESH_TOKEN
              client_id = $env:CLIENT_ID
              client_secret = $env:CLIENT_SECRET
            } -TimeoutSec 30
            if (-not $token.access_token) { throw "Missing access token." }
            foreach ($file in $files) {
              $destination = Join-Path release-artifact $file.name
              Invoke-WebRequest -Uri "https://www.googleapis.com/drive/v3/files/$($file.id)?alt=media" `
                -Headers @{ Authorization = "Bearer $($token.access_token)" } -OutFile $destination -TimeoutSec 300
              if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256) {
                throw "Downloaded file checksum mismatch."
              }
            }
          } catch {
            throw "Google Drive authentication/download/checksum verification failed; no release assets were attached."
          }

      - name: Verify and attach without replacing or publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          EXPECTED_ARTIFACT: ${{ needs.build.outputs.artifact }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $m = Get-Content release-artifact/build-manifest.json -Raw | ConvertFrom-Json
          if ($m.source_pr) { throw "PR artifacts must never be attached to a release." }
          if ($m.artifact -ne $env:EXPECTED_ARTIFACT -or $m.source_commit -ne $env:SOURCE_COMMIT -or
              $m.source_status -ne 'clean' -or $m.version -ne $env:EXPECTED_VERSION -or
              $env:RELEASE_TAG -ne "v$($m.version)") { throw "Artifact provenance mismatch." }
          $exe = "release-artifact/$env:EXPECTED_ARTIFACT"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $m.sha256 -or (Get-Item $exe).Length -ne $m.size_bytes) {
            throw "Artifact checksum/size mismatch."
          }
          $sums = (Get-Content release-artifact/SHA256SUMS.txt -Raw).Trim()
          if ($sums -ne "$hash  $env:EXPECTED_ARTIFACT") { throw "Checksum file mismatch." }
          # Recheck the remote tag and release immediately before any writes.
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw "Cannot inspect remote tag." }
          $object = $ref.object
          while ($object.type -eq 'tag') {
            $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE) { throw "Cannot dereference remote tag." }
            $object = $tag.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $env:SOURCE_COMMIT) {
            throw "Remote tag moved after the build."
          }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp
          if ($LASTEXITCODE) { throw "Cannot inspect releases." }
          $existing = @(
            foreach ($page in ($json | ConvertFrom-Json)) {
              foreach ($release in $page) {
                if ($release.tag_name -eq $env:RELEASE_TAG) { $release }
              }
            }
          )
          $files = @($exe, 'release-artifact/SHA256SUMS.txt', 'release-artifact/build-manifest.json')
          if ($existing.Count -gt 1) { throw "Unexpected duplicate release." }
          if ($existing.Count -eq 1) {
            if (-not $existing[0].draft) { throw "Refusing to modify a published release." }
            foreach ($file in $files) {
              if ([IO.Path]::GetFileName($file) -in $existing[0].assets.name) {
                throw "Asset already exists; refusing replacement. Review the existing draft manually."
              }
            }
            gh release upload $env:RELEASE_TAG @files
          } else {
            $notes = Get-Content "devdocs/releases/$env:RELEASE_TAG.md" -Raw
            $base = [Uri]"https://github.com/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_TAG/devdocs/releases/"
            $notes = [regex]::Replace($notes, '\[([^\]]+)\]\(([^)]+)\)', {
              param($match)
              $target = $match.Groups[2].Value
              if ($target -match '^[a-zA-Z][a-zA-Z0-9+.-]*:' -or $target.StartsWith('#')) { return $match.Value }
              return "[$($match.Groups[1].Value)]($([Uri]::new($base, $target).AbsoluteUri))"
            })
            $notes += "`n`n## CI build awaiting owner acceptance`nSource: $env:SOURCE_COMMIT (clean).`nArtifact: $env:EXPECTED_ARTIFACT`nSHA256: $hash`n`nDownload and smoke-test this exact executable before publishing. See build-manifest.json for toolchain and run provenance.`n"
            New-Item -ItemType Directory -Path tmp -Force | Out-Null
            Set-Content tmp/draft-release-notes.md $notes -NoNewline -Encoding utf8
            gh release create $env:RELEASE_TAG @files --verify-tag --draft --title "DTFlow $($m.version)" --notes-file tmp/draft-release-notes.md
          }
          if ($LASTEXITCODE) { throw "Draft attachment failed; inspect partial upload before retrying." }
          $uploaded = gh release view $env:RELEASE_TAG --json isDraft,assets,url | ConvertFrom-Json
          if ($LASTEXITCODE -or -not $uploaded.isDraft) { throw "Release must remain a draft." }
          New-Item -ItemType Directory -Path tmp/download-check -Force | Out-Null
          gh release download $env:RELEASE_TAG --pattern $env:EXPECTED_ARTIFACT --pattern SHA256SUMS.txt --pattern build-manifest.json --dir tmp/download-check
          if ($LASTEXITCODE) { throw "Uploaded assets are not downloadable." }
          foreach ($file in $files) {
            $downloaded = Join-Path tmp/download-check ([IO.Path]::GetFileName($file))
            if ((Get-FileHash $file).Hash -ne (Get-FileHash $downloaded).Hash) {
              throw "Uploaded/downloaded asset mismatch."
            }
          }
          @("Draft prepared: $($uploaded.url)", "All three downloaded assets verified.",
            "Owner smoke and explicit publication remain pending. No release was published.") |
            Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
