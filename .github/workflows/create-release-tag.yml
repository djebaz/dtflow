name: Create release tag
run-name: Create tag v${{ inputs.version }}

# Creates the candidate tag vX.Y.Z on a commit that is already merged into main.
# It only creates a tag: no release, draft or build is touched. The tag then feeds
# "Build Windows EXE and draft release" (release_tag input). An existing tag is
# never moved or replaced.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z without the v prefix. Must equal the version in pyproject.toml on the ref."
        type: string
        required: true
      ref:
        description: "Branch or full commit SHA to tag. Must be part of main. Default: main."
        type: string
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: create-release-tag-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tag:
    name: Verify and create tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like X.Y.Z (no v prefix, no suffix)."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source, notes and tag state
        id: verify
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          tag="v$VERSION"

          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Commit $commit is not part of main."
            exit 1
          fi

          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$project_version" != "$VERSION" ]]; then
            echo "::error::pyproject.toml has version $project_version on this commit, not $VERSION."
            exit 1
          fi

          if [[ ! -f "devdocs/releases/$tag.md" ]]; then
            echo "::error::Versioned release notes devdocs/releases/$tag.md are missing."
            exit 1
          fi

          # Refuse if the tag exists on the remote, whatever it points to.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Existing tags are never moved or replaced."
            exit 1
          fi

          # Refuse if any release (draft or published) already uses the tag name.
          if gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id" | grep -q .; then
            echo "::error::A release for $tag already exists."
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.verify.outputs.commit }}
          TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # Creating a ref fails if it already exists, so a race cannot move a tag.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$COMMIT" >/dev/null
          {
            echo "Created tag \`$TAG\` on \`$COMMIT\`."
            echo
            echo "No release, draft or build was created. Next: dispatch **Build Windows EXE and draft release** from main with release_tag \`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"
