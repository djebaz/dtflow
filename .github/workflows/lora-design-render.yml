name: LoRA design renders

# Only the approved standalone LoRA Designer references; never starts DTFlow or providers.
# Add "lora:render" to a PR to request captures. Subsequent pushes refresh its previews.
run-name: >-
  LoRA design · PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: lora-design-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  UV_LOCKED: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  capture:
    name: Capture LoRA Designer forms
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'lora:render')
      && (github.event.action != 'labeled' || github.event.label.name == 'lora:render')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Qt runtime library
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Render LoRA design forms
        id: capture
        run: |
          timeout --signal=ABRT --kill-after=10s 180s \
            .venv/bin/python tools/ui/render_lora_design.py \
              --out tmp/lora-design --connections-expanded --compact-prepare
          count=$(find tmp/lora-design -maxdepth 1 -name '*.png' -type f | wc -l)
          [ "$count" -eq 7 ] || { echo "::error::Expected 7 captures, got $count."; exit 1; }
          echo "Captured 7 LoRA design states." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub screenshot artifact
        if: steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lora-design-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: tmp/lora-design/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload images to Google Drive
        id: drive
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        env:
          REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [ -n "$REFRESH_TOKEN" ] && [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] \
            || { echo "::warning::Drive credentials are unavailable; GitHub artifact remains available."; exit 1; }
          folder="lora-pr${PR_NUMBER}-$(date -u +%Y%m%dT%H%M%SZ)-${SHORT_SHA:0:7}"
          uv run python tools/ci/upload_ui_renders_to_drive.py \
            --source tmp/lora-design --mode images \
            --refresh-token "$REFRESH_TOKEN" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --run-folder "$folder" --manifest tmp/lora-design-drive.json

      - name: Publish review links to PR
        if: always() && steps.capture.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("tmp/lora-design-drive.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          by_name = {item["relative_path"]: item for item in data.get("files", [])}
          names = sorted(path.name for path in Path("tmp/lora-design").glob("*.png"))
          lines = [
              "<!-- dtflow-lora-designer-renders -->",
              "## LoRA Designer renders — 7 captures",
              "",
              f"[GitHub Actions run and PNG artifact]({os.environ['RUN_URL']})",
              "",
          ]
          if data.get("folder_url"):
              lines.extend([f"[Open Google Drive screenshots]({data['folder_url']})", ""])
          for name in names:
              item = by_name.get(name)
              if item and item.get("view_url") and item.get("content_url"):
                  lines.extend([f"**{name}**", "", f"[![{name}]({item['content_url']})]({item['view_url']})", ""])
              else:
                  lines.append(f"- {name} (see GitHub artifact)")
          lines.extend(["", "_Synthetic offline Qt design reference; not Windows or runtime acceptance._", ""])
          note = "\n".join(lines)
          Path("tmp/lora-render-note.md").write_text(note, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write(note)
          PY
          marker='<!-- dtflow-lora-designer-renders -->'
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- dtflow-lora-designer-renders -->"))) | .id' \
            | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --raw-field "body=$(cat tmp/lora-render-note.md)" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --raw-field "body=$(cat tmp/lora-render-note.md)" >/dev/null
          fi
