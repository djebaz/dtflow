name: LoRA Prepare UI renders

# Render canonical LoRA editors with synthetic data; the PNGs are published only as a GitHub artifact.
# A PR synchronize affecting Prepare triggers this scoped category automatically, without labels.
run-name: >-
  LoRA Prepare · PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - 'src/dtflow/ui/prepare_lora_editor.py'
      - 'src/dtflow/ui/forms/prepare_lora_*.ui'
      - 'src/dtflow/ui/lora_panel.py'
      - 'src/dtflow/ui/lora_selection_editor.py'
      - 'src/dtflow/ui/forms/lora_selection_*.ui'
      - 'src/dtflow/ui/forms/main_window.ui'
      - 'src/dtflow/ui/main_window.py'
      - 'tools/ui/render_states.py'
      - 'tools/ui/render_catalog.py'
      - 'tools/ui/render_catalog.json'
      - '.github/workflows/lora-design-render.yml'

permissions:
  contents: write   # only to publish previews on the ci-render-previews branch
  issues: write
  pull-requests: write

concurrency:
  group: lora-prepare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  UV_LOCKED: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  capture:
    name: Capture canonical LoRA views
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Qt runtime library
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1; }

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Render canonical LoRA Prepare and shared picker
        id: capture
        run: |
          timeout --signal=ABRT --kill-after=10s 150s \
            .venv/bin/python tools/ui/render_states.py \
              --category lora --fast --jobs 1 --out tmp/lora-ui
          count=$(find tmp/lora-ui -maxdepth 1 -name 'lora-*.png' -type f | wc -l)
          expected=$(python3 -c 'import json; states = json.load(open("tools/ui/render_catalog.json", encoding="utf-8"))["states"]; print(sum(s["category"] == "lora" and s["level"] == "f" for s in states))')
          [ "$count" -eq "$expected" ] || { echo "::error::Expected $expected LoRA captures, got $count."; exit 1; }
          echo "Captured $count LoRA Prepare, picker, hover-tooltip, and Connections views." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshot artifact
        if: steps.capture.outcome == 'success'
        id: artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lora-runtime-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: tmp/lora-ui/lora-*.png
          if-no-files-found: error
          retention-days: 2

      - name: Publish previews on the ci-render-previews branch
        id: previews
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A CI-owned branch holding one parentless commit with each PR's latest renders, so history never grows.
          branch=ci-render-previews
          short="${HEAD_SHA:0:7}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            rm -rf tmp/previews && mkdir -p tmp/previews && cd tmp/previews
            git init -q && git remote add origin "$url"
            old=""
            if git fetch -q --depth 1 origin "$branch"; then
              old=$(git rev-parse FETCH_HEAD)
              git checkout -q -b "$branch" FETCH_HEAD
            else
              git checkout -q --orphan "$branch"
            fi
            rm -rf "pr${PR_NUMBER}" && mkdir -p "pr${PR_NUMBER}/${short}"
            cp ../lora-ui/lora-*.png "pr${PR_NUMBER}/${short}/"
            git add -A
            commit=$(git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit-tree "$(git write-tree)" -m "CI render previews (latest per PR)")
            if git push -q --force-with-lease="refs/heads/${branch}:${old}" origin "${commit}:refs/heads/${branch}"; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cd ../..
            sleep $((attempt * 3))
          done
          echo "::warning::Could not publish previews; the artifact remains available."
          exit 1

      - name: Publish review links to PR
        if: always() && steps.capture.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIEWS: ${{ steps.previews.outputs.published }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_NAME: lora-runtime-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          names = sorted(path.name for path in Path("tmp/lora-ui").glob("lora-*.png"))
          lines = [
              "<!-- dtflow-lora-designer-renders -->",
              f"## Canonical LoRA views — {len(names)} captures",
              "",
              f"Download the PNGs: artifact **{os.environ['ARTIFACT_NAME']}** (kept 2 days) at the bottom of the "
              f"[workflow run]({os.environ['RUN_URL']})"
              + (f", or [direct download]({os.environ['ARTIFACT_URL']})." if os.environ.get("ARTIFACT_URL") else "."),
              "",
          ]
          if os.environ.get("PREVIEWS") == "true":
              base = (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/raw/ci-render-previews/"
                  f"pr{os.environ['PR_NUMBER']}/{os.environ['HEAD_SHA'][:7]}"
              )
              lines.extend(["<table>"])
              for start in range(0, len(names), 3):
                  lines.append("<tr>")
                  for name in names[start : start + 3]:
                      lines.append(
                          f'<td width="33%" valign="top"><a href="{base}/{name}"><img src="{base}/{name}" width="100%" '
                          f'alt="{name}"></a><br><sub>{name}</sub></td>'
                      )
                  lines.extend(["</tr>"])
              lines.extend(["</table>", ""])
          else:
              lines.extend(f"- {name}" for name in names)
          lines.extend(["", "_Canonical Qt editor with synthetic offline rows; not Windows or provider acceptance._", ""])
          note = "\n".join(lines)
          Path("tmp/lora-render-note.md").write_text(note, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write(note)
          PY
          marker='<!-- dtflow-lora-designer-renders -->'
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- dtflow-lora-designer-renders -->"))) | .id' \
            | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --raw-field "body=$(cat tmp/lora-render-note.md)" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --raw-field "body=$(cat tmp/lora-render-note.md)" >/dev/null
          fi
