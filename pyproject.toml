[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtflow"
version = "0.0.0"
description = "Desktop workflows, generation and automation for Draw Things."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "drawthings-py>=0.4.1,<0.5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".dtflow", "tmp", ".venv", "build", "dist"]
