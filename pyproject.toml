[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtflow"]

[project]
name = "dtflow"
version = "0.0.0"
description = "Desktop workflows, generation and automation for Draw Things."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
dependencies = [
    "drawthings-py>=0.4.0,<0.5.0",
    "grpclib>=0.4.9,<0.5.0",
]

[project.scripts]
dtflow = "dtflow.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
]

[tool.uv]
prerelease = "allow"
# drawthings-py 0.4.x declares NumPy >=2.4.4, but the tested legacy Windows
# Pentium E6500 machine cannot load the NumPy 2.4+ x86-64 wheel baseline.
# NumPy 2.3.5 imports successfully and has been verified through the real
# Draw Things gRPC/model-browser connection path. Keep the drawthings-py
# project dependency bounded to <0.5.0 so this override is reconsidered
# before adopting a future release line with different runtime requirements.
override-dependencies = ["numpy==2.3.5"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = [".dtflow", "tmp", ".venv", "build", "dist"]
