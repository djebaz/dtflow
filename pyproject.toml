[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtflow"]

[project]
name = "dtflow"
version = "5.5.0"
description = "Desktop workflows, generation and automation for Draw Things."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
dependencies = [
    "drawthings-py>=0.4.0,<0.5.0",
    "grpclib>=0.4.9,<0.5.0",
    "httpx>=0.28.1,<0.29.0",
    "keyring>=25.7.0",
    "nodeeditor-qtpy==0.8.2",
    "numpy==2.3.5",
    "onnxruntime>=1.20,<2",
    "orjson==3.13.0",
    "pillow>=12.1,<13",
    "pyside6-essentials>=6.12.0",
    "qtpy==2.4.3",
    "quickjs-ng>=0.17.0.2",
    "tzdata>=2026.6",
]

[project.scripts]
dtflow = "dtflow.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-qt>=4.5.0",
    "pytest-xdist>=3.8.0",
    "ruff",
]
mask-poc = [
    "numpy==2.3.5",
    "onnxruntime>=1.20,<2",
    "pillow>=12.1,<13",
]

[tool.uv]
prerelease = "allow"
# drawthings-py 0.4.x declares NumPy >=2.4.4, but the tested legacy Windows
# Pentium E6500 machine cannot load the NumPy 2.4+ x86-64 wheel baseline.
# NumPy 2.3.5 imports successfully and has been verified through the real
# Draw Things gRPC/model-browser connection path. Keep the drawthings-py
# project dependency bounded to <0.5.0 so this override is reconsidered
# before adopting a future release line with different runtime requirements.
override-dependencies = ["numpy==2.3.5"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
# The Windows benchmark lives in the source-only root tools/ namespace,
# outside the installed src/dtflow wheel. Keep it importable when the CI
# executes the pytest console script rather than python -m pytest.
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Report the slowest tests so suite-time regressions stay visible in CI logs.
addopts = "--durations=25 --durations-min=0.2"
norecursedirs = [".dtflow", "tmp", ".venv", "build", "dist"]
